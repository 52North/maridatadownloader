[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "maridatadownloader"
version = "0.1"
authors = [
  { name="52N Developers", email="info@52north.org" },
]
description = "Python package for downloading metocean (dynamic meteorological and oceanographic conditions) and static bathymetric data"
readme = "README.md"
#license = { file="LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "cdsapi>=0.7.2",
    "copernicusmarine",
    "dask",
    "pydap",
    "xarray",
    "netCDF4",
    "numpy",
    "pandas",
    "scipy"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["maridatadownloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests which access remote data sources (run with '-m network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]